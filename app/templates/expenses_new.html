{% extends "base.html" %}
{% block title %}Ausgabe hinzufügen — Finanzverwaltung{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Ausgabe hinzufügen</h5>
      </div>
      <div class="card-body">
        <form method="post" action="/expenses" novalidate>
          <div class="mb-3">
            <label for="date" class="form-label">Datum <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="date" name="date" value="{{ today }}" required>
          </div>
          <div class="mb-3">
            <label for="amount" class="form-label">Betrag (€) <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="amount" name="amount"
                   placeholder="0.00" inputmode="decimal" required>
          </div>
          <div class="mb-3">
            <label for="category_id" class="form-label">Kategorie</label>
            <select class="form-select" id="category_id" name="category_id">
              <option value="">— Ohne Kategorie —</option>
              {% for c in categories %}
              <option value="{{ c.id }}">
                {% if c.parent_id %}↳ {% endif %}{{ c.name }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Beschreibung</label>
            <input type="text" class="form-control" id="description" name="description"
                   placeholder="Optionale Notiz" maxlength="500">
          </div>
          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="recurring" name="recurring">
            <label class="form-check-label" for="recurring">Wiederkehrende Ausgabe</label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a href="/expenses" class="btn btn-outline-secondary">Abbrechen</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
