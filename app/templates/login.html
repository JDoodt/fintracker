<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Finanzverwaltung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card shadow" style="width:100%; max-width:360px">
  <div class="card-body p-4">
    <h4 class="card-title text-center mb-4">
      <i class="bi bi-cash-stack text-primary"></i> Finanzverwaltung
    </h4>
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Benutzername</label>
        <input type="text" class="form-control" id="username" name="username"
               autocomplete="username" autofocus required>
      </div>
      <div class="mb-4">
        <label for="pin" class="form-label">PIN</label>
        <input type="password" class="form-control" id="pin" name="pin"
               inputmode="numeric" pattern="[0-9]{4,8}" autocomplete="current-password" required>
        <div class="form-text">4–8-stellige PIN</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Anmelden</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
